name: Setup
description: Checkout-independent toolchain setup for every CI job - .NET (pinned by global.json), task, bun, and a NuGet cache. No secrets.
inputs:
  bun:
    description: Also install bun (SIT, log-file test and the boundary check run on it)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - uses: arduino/setup-task@v2
      with:
        version: 3.48.0
        repo-token: ${{ github.token }}
    - if: ${{ inputs.bun == 'true' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.13
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-
